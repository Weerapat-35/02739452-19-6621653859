services:
  postgres:
    image: postgres:16
    container_name: pl_postgres
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football123
      POSTGRES_DB: football_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build: ./airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://football:football123@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_FOOTBALL_DB: postgresql://football:football123@postgres:5432/football_db
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "pl-dashboard-student-project-secret"
      # both values are read from the .env file next to docker-compose.yml (see .env.example)
      SCRAPER_CONTACT: "${SCRAPER_CONTACT:-student-project@example.com}"
      FOOTBALL_DATA_API_KEY: "${FOOTBALL_DATA_API_KEY:-}"
      AIRFLOW_UID: "50000"
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true)"
    restart: "no"

  airflow-webserver:
    build: ./airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build: ./airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://football:football123@postgres:5432/football_db
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  postgres_data:
